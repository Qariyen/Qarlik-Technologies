<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qarlik Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0f1e;
      --accent: #ff0000;
      --accent2: #7b2fff;
      --glow: rgba(0, 200, 255, 0.18);
      --text: #e0f4ff;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Rajdhani', sans-serif;
      cursor: none;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridScroll 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridScroll {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, #040810 100%);
      pointer-events: none;
      z-index: 0;
    }

    #particles {
      position: fixed; inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-100vh) scale(0.4); opacity: 0; }
    }

    #screensaver {
      position: fixed; inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #logo-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      user-select: none;
      /* soft light glow behind the logo */
      filter: drop-shadow(0 0 14px rgba(0,200,255,0.25)) drop-shadow(0 0 28px rgba(123,47,255,0.15));
      transition: filter 0.4s;
    }

    #logo-wrap img {
      width: 180px;
      height: auto;
      display: block;
      /* solid black logo */
      filter: brightness(0) saturate(100%);
      opacity: 1;
    }

    #logo-wrap .brand {
      text-align: center;
    }

    #logo-wrap .brand-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.18em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }

    #logo-wrap .brand-tag {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: #ff6666;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 1;
    }

    #logo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,200,255,0.03) 3px, rgba(0,200,255,0.03) 4px
      );
      pointer-events: none;
      border-radius: 6px;
    }

    #ui {
      position: fixed;
      bottom: 28px;
      right: 32px;
      z-index: 100;
      display: flex;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    #ui.visible {
      opacity: 1;
      pointer-events: all;
    }

    .ctrl-btn {
      background: rgba(0,200,255,0.08);
      border: 1px solid rgba(0,200,255,0.3);
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      padding: 10px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s, color 0.2s;
      backdrop-filter: blur(6px);
      border-radius: 2px;
    }

    .ctrl-btn:hover {
      background: rgba(0,200,255,0.2);
      box-shadow: 0 0 18px rgba(0,200,255,0.35);
      color: #fff;
    }

    #watermark {
      position: fixed;
      bottom: 28px;
      left: 32px;
      z-index: 100;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      color: rgba(0,200,255,0.2);
      text-transform: uppercase;
    }

    #clock {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 100;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: rgba(0,200,255,0.35);
      letter-spacing: 0.12em;
    }

    .corner {
      position: fixed;
      width: 40px; height: 40px;
      z-index: 5;
      opacity: 0.4;
    }
    .corner.tl { top: 20px; left: 20px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
    .corner.tr { top: 20px; right: 20px; border-top: 1px solid var(--accent); border-right: 1px solid var(--accent); }
    .corner.bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--accent); border-left: 1px solid var(--accent); }
    .corner.br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }

    @keyframes pulseRing {
      0%   { transform: scale(0.92); opacity: 0.5; }
      50%  { transform: scale(1.04); opacity: 0.15; }
      100% { transform: scale(0.92); opacity: 0.5; }
    }

    #ring {
      position: fixed;
      inset: 0;
      margin: auto;
      width: min(50vw, 50vh);
      height: min(50vw, 50vh);
      border-radius: 50%;
      border: 1px solid rgba(0,200,255,0.12);
      animation: pulseRing 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    #cursor {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      box-shadow: 0 0 12px var(--accent);
      transition: width 0.2s, height 0.2s;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="ring"></div>
  <div id="particles"></div>
  <div id="clock"></div>

  <div id="screensaver">
    <div id="logo-wrap">
      <img src="3dgifmaker33330.gif" alt="Qarlik Logo" id="logo-img"/>
      <div class="brand">
        <div class="brand-name">Qarlik</div>
        <div class="brand-tag">Technologies</div>
      </div>
    </div>
  </div>

  <div id="ui">
    <button class="ctrl-btn" id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <div id="watermark">© Qarlik Technologies</div>
  <div id="cursor"></div>

<script>
  const clockEl = document.getElementById('clock');
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    clockEl.textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  const ui = document.getElementById('ui');
  let uiTimer;
  document.addEventListener('mousemove', () => {
    ui.classList.add('visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => ui.classList.remove('visible'), 2500);
  });

  const wrap = document.getElementById('logo-wrap');
  const screen = document.getElementById('screensaver');

  let x, y, vx, vy;

  function initBounce() {
    const sw = screen.clientWidth;
    const sh = screen.clientHeight;
    const ww = wrap.offsetWidth;
    const wh = wrap.offsetHeight;

    x = Math.random() * (sw - ww);
    y = Math.random() * (sh - wh);

    const speed = 1.1;
    const angle = Math.random() * 2 * Math.PI;
    vx = Math.cos(angle) * speed;
    vy = Math.sin(angle) * speed;

    wrap.style.left = x + 'px';
    wrap.style.top  = y + 'px';
  }

  const colors = [
    'rgba(0,200,255,0.28)',
    'rgba(123,47,255,0.28)',
    'rgba(0,255,180,0.28)',
    'rgba(255,80,140,0.28)',
    'rgba(255,200,0,0.28)',
  ];
  let colorIdx = 0;

  const CONFETTI_COLORS = ['#00c8ff','#7b2fff','#ff508c','#00ffb4','#ffe048','#ff7c3a','#fff'];
  const confettiContainer = document.getElementById('particles');

  function spawnConfetti(cx, cy) {
    const COUNT = 60;
    for (let i = 0; i < COUNT; i++) {
      const el = document.createElement('div');
      const size = Math.random() * 8 + 4;
      const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      const angle = Math.random() * 360;
      const dist  = Math.random() * 260 + 80;
      const spin  = (Math.random() - 0.5) * 720;
      const dur   = Math.random() * 700 + 600;
      const isRect = Math.random() > 0.5;

      el.style.cssText = `
        position:absolute;
        left:${cx}px; top:${cy}px;
        width:${isRect ? size*1.8 : size}px;
        height:${size}px;
        background:${color};
        border-radius:${isRect ? '2px' : '50%'};
        pointer-events:none;
        z-index:50;
        opacity:1;
        transform-origin:center center;
      `;
      confettiContainer.appendChild(el);

      const rad = (angle * Math.PI) / 180;
      const tx = Math.cos(rad) * dist;
      const ty = Math.sin(rad) * dist;

      el.animate([
        { transform: `translate(0,0) rotate(0deg)`,                  opacity: 1 },
        { transform: `translate(${tx}px,${ty + 120}px) rotate(${spin}deg)`, opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(0.2,0.8,0.4,1)', fill: 'forwards' })
        .onfinish = () => el.remove();
    }
  }

  const CORNER_THRESH = 120;

  function isNearCorner(cx, cy, sw, sh) {
    return (
      (cx < CORNER_THRESH && cy < CORNER_THRESH) ||
      (cx > sw - CORNER_THRESH && cy < CORNER_THRESH) ||
      (cx < CORNER_THRESH && cy > sh - CORNER_THRESH) ||
      (cx > sw - CORNER_THRESH && cy > sh - CORNER_THRESH)
    );
  }

  let lastCornerTime = 0;

  function bounce() {
    const sw = screen.clientWidth;
    const sh = screen.clientHeight;
    const ww = wrap.offsetWidth;
    const wh = wrap.offsetHeight;

    x += vx;
    y += vy;

    let hitH = false, hitV = false;

    if (x <= 0)        { x = 0;       vx =  Math.abs(vx); hitH = true; }
    if (x + ww >= sw)  { x = sw - ww; vx = -Math.abs(vx); hitH = true; }
    if (y <= 0)        { y = 0;       vy =  Math.abs(vy); hitV = true; }
    if (y + wh >= sh)  { y = sh - wh; vy = -Math.abs(vy); hitV = true; }

    if (hitH || hitV) {
      colorIdx = (colorIdx + 1) % colors.length;
      const c = colors[colorIdx];
      wrap.style.filter = `drop-shadow(0 0 16px ${c}) drop-shadow(0 0 30px ${c.replace('0.28','0.15')})`;

      if (hitH && hitV) {
        const now = Date.now();
        if (now - lastCornerTime > 800) {
          lastCornerTime = now;
          const cx = x + ww / 2;
          const cy = y + wh / 2;
          spawnConfetti(cx, cy);
        }
      }
    }

    wrap.style.left = x + 'px';
    wrap.style.top  = y + 'px';

    requestAnimationFrame(bounce);
  }

  const logoImg = document.getElementById('logo-img');
  logoImg.onload = () => { initBounce(); bounce(); };
  logoImg.onerror = () => { initBounce(); bounce(); };
  if (logoImg.complete) { initBounce(); bounce(); }

  window.addEventListener('resize', () => {
    x = Math.min(x, screen.clientWidth  - wrap.offsetWidth);
    y = Math.min(y, screen.clientHeight - wrap.offsetHeight);
  });

  const pContainer = document.getElementById('particles');
  const PARTICLE_COUNT = 40;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    const left = Math.random() * 100;
    const dur  = Math.random() * 18 + 10;
    const delay = Math.random() * -dur;
    const hue = Math.random() > 0.5 ? '190' : '270';
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${left}%;
      bottom: -10px;
      background: hsl(${hue},100%,70%);
      box-shadow: 0 0 ${size*3}px hsl(${hue},100%,70%);
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    pContainer.appendChild(p);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
      document.getElementById('fsBtn').textContent = '✕ Exit Full';
    } else {
      document.exitFullscreen();
      document.getElementById('fsBtn').textContent = '⛶ Fullscreen';
    }
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement)
      document.getElementById('fsBtn').textContent = '⛶ Fullscreen';
  });
</script>
</body>
</html>
